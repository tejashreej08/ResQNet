services:
  - type: web
    name: resqnet-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://res-q-phbjjmzty-tejashreej08.vercel.app
      - key: USE_MONGODB
        value: false
      - key: USE_POSTGIS
        value: false
